name: CI

on:
  pull_request:

# Every CI run seeds + mutates ONE shared Neon branch (test-data, via
# secrets.DATABASE_URL). Two runs overlapping — e.g. two quick pushes, or two open
# PRs — race that single DB: one run's seedE2E() wipe/reseed and its e2e writes
# land in the other's mid-flight view (off-by-one row counts, reset follow/react
# state). So serialize ci WORKFLOW runs on one global group (a constant key, NOT
# github.ref — the DB is shared across every PR). cancel-in-progress:false queues
# instead of cancelling, since cancelling mid-seed would leave the DB dirty.
#
# Scope + trade-offs (deliberate, not oversights):
#  - This serializes CI runs only. It is NOT a DB mutex: a local `npm run test:e2e`
#    (or any non-Actions writer) pointed at the same test-data DATABASE_URL can
#    still race a live CI run. The seed-e2e host guard limits blast radius, not
#    concurrency.
#  - Global serialization means two active PRs' CI queue behind each other
#    (~doubling time-to-green). Acceptable at solo/low volume; if throughput ever
#    matters, the real fix is a per-run isolated Neon branch instead of one shared
#    test-data DB (then this guard can drop).
#  - With a constant group, a burst of 3+ runs can leave an older PENDING run
#    auto-cancelled by GitHub (cancel-in-progress:false only protects the RUNNING
#    one). Harmless here — no required status checks on this free-tier repo — so a
#    cancelled run is just re-run, never a silent merge block.
concurrency:
  group: ci-shared-test-db
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
      PLAYWRIGHT_TEST_CLERK_USER_ID: ${{ secrets.PLAYWRIGHT_TEST_CLERK_USER_ID }}
      PLAYWRIGHT_RUNNER_EMAIL: ${{ secrets.PLAYWRIGHT_RUNNER_EMAIL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      # Dedicated CI-only Upstash Redis (never Preview/prod KV) — @vercel/kv
      # throws on first use without these, crashing any page whose server render
      # touches the votes/race-tags store (e.g. /run-config), which was failing
      # the run-config e2e specs. e2e vote/rating writes land in this throwaway
      # DB, so they never touch Preview or production KV.
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # No .env.test file needed here — the job-level env above already puts
      # these in process.env, and both playwright.config.ts's dotenv.config()
      # and __tests__/setup.ts's are no-ops when the file they target is
      # missing (never true, since .env.test/.env.local are gitignored and
      # not checked out in CI); they don't clear vars already set.
      - run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
